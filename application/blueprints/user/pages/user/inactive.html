{% extends "base.html" %}

{% block title %}Account Inactive{% endblock %}

{% block content %}
<div class="thc-page" style="max-width:var(--thc-space-150);">
    <div class="thc-card text-center" style="padding:var(--thc-space-12) var(--thc-space-8);">
        <div class="mb-4" style="font-size:var(--thc-text-4xl);">&#x26A0;</div>
        <h4 class="mb-2">Account Inactive</h4>
        <p class="text-muted mb-6">
            Your account is currently inactive.<br>
            Please contact your system administrator to get access.
        </p>
        <a href="{{ url_for('user.login') }}" class="btn btn-secondary btn-sm">Back to Login</a>
    </div>
</div>
{% endblock %}
