<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Payee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --thc-primary: #1a6473;
            --thc-primary-hover: #135260;
            --thc-border: #dee2e6;
            --thc-bg: #f8f9fa;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--thc-bg);
            padding: 0;
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        .popup-container {
            max-width: 580px;
            width: 90%;
            margin: 0;
            padding: 0;
        }

        .popup-header {
            text-align: center;
            margin-bottom: 1.25rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--thc-primary);
        }

        .popup-header h4 {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--thc-primary);
            margin: 0;
        }

        .form-card {
            background: white;
            border-radius: 12px;
            padding: 1.75rem 1.5rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            border: 1px solid var(--thc-border);
            max-height: 90vh;
            overflow-y: auto;
        }

        .mb-3 {
            margin-bottom: 1rem !important;
        }

        .mb-4 {
            margin-bottom: 1rem !important;
        }

        .form-label {
            font-size: 0.8125rem;
            font-weight: 600;
            color: #495057;
            margin-bottom: 0.4rem;
        }

        .form-control, .form-check-input {
            border: 1px solid var(--thc-border);
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .form-control:focus {
            border-color: var(--thc-primary);
            box-shadow: 0 0 0 3px rgba(26, 100, 115, 0.1);
            outline: none;
        }

        .form-control.is-invalid {
            border-color: #dc3545;
        }

        .invalid-feedback {
            display: block;
            font-size: 0.8125rem;
            color: #dc3545;
            margin-top: 0.25rem;
        }

        textarea.form-control {
            resize: none;
            height: 60px;
        }

        .form-check {
            padding-left: 1.75rem;
        }

        .form-check-input {
            width: 1.25rem;
            height: 1.25rem;
            margin-top: 0.15rem;
            cursor: pointer;
        }

        .form-check-label {
            font-weight: 600;
            color: #495057;
            cursor: pointer;
        }

        .btn-group-popup {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            margin-top: 1.25rem;
            padding-top: 0.5rem;
        }

        .btn-save {
            background-color: var(--thc-primary);
            color: white;
            border: none;
            padding: 0.625rem 1.75rem;
            font-size: 0.9375rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.15s, transform 0.1s;
        }

        .btn-save:hover {
            background-color: var(--thc-primary-hover);
            transform: translateY(-1px);
        }

        .btn-save:active {
            transform: translateY(0);
        }

        .btn-cancel {
            background-color: transparent;
            color: #6c757d;
            border: 2px solid #6c757d;
            padding: 0.625rem 1.75rem;
            font-size: 0.9375rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.15s;
        }

        .btn-cancel:hover {
            background-color: #6c757d;
            color: white;
            transform: translateY(-1px);
        }

        .btn-cancel:active {
            transform: translateY(0);
        }

        html {
            overflow: hidden;
        }

        .required-mark {
            color: #dc3545;
            font-weight: 700;
        }

        @media (max-width: 640px) {
            .popup-container {
                padding: 1rem;
            }

            .form-card {
                padding: 1.5rem;
            }

            .btn-group-popup {
                flex-direction: column;
            }

            .btn-save, .btn-cancel {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="popup-container">
        <div class="popup-header">
            <h4>Add Payee</h4>
        </div>

        <div class="form-card">
            <form action="{{ url_for('payee.add_popup') }}" method="post" id="payeeForm">
                <div class="mb-3">
                    <label for="name" class="form-label">
                        Payee Name <span class="required-mark">*</span>
                    </label>
                    <input
                        type="text"
                        class="form-control {{ 'is-invalid' if form.errors.get('name') }}"
                        id="name"
                        name="name"
                        value="{{ form.name or '' }}"
                        autofocus
                        required>
                    {% if form.errors.get('name') %}
                        <div class="invalid-feedback">{{ form.errors.name }}</div>
                    {% endif %}
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea
                        class="form-control {{ 'is-invalid' if form.errors.get('description') }}"
                        id="description"
                        name="description"
                    >{{ form.description or '' }}</textarea>
                    {% if form.errors.get('description') %}
                        <div class="invalid-feedback">{{ form.errors.description }}</div>
                    {% endif %}
                </div>

                <div class="mb-4">
                    <div class="form-check">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            name="active"
                            id="active"
                            {{ 'checked' if form.active or form.active is none else '' }}>
                        <label class="form-check-label" for="active">
                            Active
                        </label>
                    </div>
                </div>

                <div class="btn-group-popup">
                    <button type="submit" class="btn-save">Save Payee</button>
                    <button type="button" class="btn-cancel">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let formSubmitting = false;

        document.addEventListener('DOMContentLoaded', function() {
            const firstInput = document.getElementById('name');
            if (firstInput) {
                firstInput.focus();
            }
        });

        document.getElementById('payeeForm').addEventListener('submit', function(e) {
            const name = document.getElementById('name').value.trim();

            if (!name) {
                e.preventDefault();
                alert('Payee name is required.');
                return false;
            }

            formSubmitting = true;
        });

        window.addEventListener('beforeunload', function(e) {
            if (formSubmitting) {
                return;
            }

            const name = document.getElementById('name').value.trim();

            if (name) {
                e.preventDefault();
                e.returnValue = 'You have unsaved changes. Are you sure you want to leave?';
                return e.returnValue;
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const name = document.getElementById('name').value.trim();

                if (name) {
                    if (confirm('Close without saving? All entered data will be lost.')) {
                        window.close();
                    }
                } else {
                    window.close();
                }
            }
        });

        window.addEventListener('DOMContentLoaded', function() {
            const cancelButtons = document.querySelectorAll('.btn-cancel');
            cancelButtons.forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const name = document.getElementById('name').value.trim();

                    if (name) {
                        if (confirm('Close without saving? All entered data will be lost.')) {
                            window.close();
                        }
                    } else {
                        window.close();
                    }
                });
            });
        });
    </script>
</body>
</html>
