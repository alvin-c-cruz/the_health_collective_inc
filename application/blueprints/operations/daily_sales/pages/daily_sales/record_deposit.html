{% extends "base.html" %}

{% block title %}Record Deposit{% endblock %}

{% block content %}
<div class="thc-page">

  <div class="row mb-3">
    <div class="col">
      <h4>Record Deposit</h4>
      <hr>
    </div>
  </div>

  <!-- Form -->
  <form method="POST">

    <div class="row mb-3">
      <div class="col-md-4">
        <label class="form-label">Deposit Date</label>
        <input type="date" name="record_date" class="form-control" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Reference Number</label>
        <input type="text" name="reference_number" class="form-control upper-case" placeholder="Bank slip / ref no.">
      </div>
      <div class="col-md-4">
        <label class="form-label">Amount</label>
        <input type="number" name="amount" class="form-control" placeholder="0.00" step="0.01" min="0" required>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">Bank / Account</label>
        <input type="text" name="bank" class="form-control upper-case" placeholder="e.g. BDO Savings - 1234">
      </div>
      <div class="col-md-6">
        <label class="form-label">Notes</label>
        <input type="text" name="notes" class="form-control" placeholder="Optional">
      </div>
    </div>

    <div class="row mb-4">
      <div class="col d-flex gap-2">
        <button type="submit" class="btn btn-primary"
          onclick="return confirmSubmit()">Save Deposit</button>
        <a href="javascript:history.back()" class="btn btn-secondary btn-sm">Cancel</a>
      </div>
    </div>

  </form>

  <hr>

  <!-- Placeholder table -->
  <div class="row mb-2">
    <div class="col">
      <h6>Deposit Records</h6>
    </div>
  </div>

  <div class="row">
    <div class="col">
      <table class="thc-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Date</th>
            <th>Reference No.</th>
            <th>Bank / Account</th>
            <th class="text-end">Amount</th>
            <th>Notes</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="7" class="text-center text-muted">No deposit records yet.</td>
          </tr>
        </tbody>
      </table>
    </div>
{% endblock %}
