<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Maintenance - {{ config.COMPANY_NAME }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: var(--thc-bg-app);
            font-family: var(--thc-font-body);
            color: var(--thc-text-primary);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .maintenance-container {
            max-width: 600px;
            padding: var(--thc-space-8);
            text-align: center;
        }

        .maintenance-card {
            background: var(--thc-bg-surface);
            border-radius: var(--thc-radius-xl);
            padding: var(--thc-space-10);
            box-shadow: var(--thc-shadow-lg);
        }

        .maintenance-icon {
            font-size: 80px;
            color: var(--thc-warning-600);
            margin-bottom: var(--thc-space-6);
        }

        .maintenance-title {
            font-family: var(--thc-font-heading);
            font-size: var(--thc-h1-size);
            color: var(--thc-text-primary);
            margin-bottom: var(--thc-space-4);
            font-weight: 600;
        }

        .maintenance-message {
            font-size: var(--thc-body-lg-size);
            color: var(--thc-text-secondary);
            line-height: 1.6;
            margin-bottom: var(--thc-space-6);
        }

        .maintenance-details {
            background: var(--thc-bg-subtle);
            border-radius: var(--thc-radius-lg);
            padding: var(--thc-space-5);
            margin-top: var(--thc-space-6);
        }

        .maintenance-details p {
            margin: var(--thc-space-2) 0;
            font-size: var(--thc-body-size);
            color: var(--thc-text-secondary);
        }

        .maintenance-details strong {
            color: var(--thc-text-primary);
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="maintenance-card">
            <div class="maintenance-icon">
                <i class="bi bi-cone-striped"></i>
            </div>

            <h1 class="maintenance-title">Site Under Maintenance</h1>

            <p class="maintenance-message">
                We're currently performing scheduled maintenance to improve your experience.
                The system will be back online shortly.
            </p>

            <div class="maintenance-details">
                <p><strong>Status:</strong> Maintenance in Progress</p>
                <p><strong>Estimated Duration:</strong> Please check back soon</p>
                <p>If you need immediate assistance, please contact your system administrator.</p>
            </div>
        </div>
    </div>
</body>
</html>
