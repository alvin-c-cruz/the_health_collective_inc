<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/css/bootstrap-icons.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/css/fonts.css') }}">

    <title>{% block title %}The Health Collective{% endblock %}</title>
    <style>
      :root {
        --thc-primary:       #1a6473;
        --thc-primary-dark:  #135260;
        --thc-primary-light: #e6f3f5;
        --thc-bg:            #f8f9fa;
        --thc-surface:       #ffffff;
        --thc-border:        #e2e8f0;
        --thc-text:          #1a2a2a;
        --thc-text-muted:    #6b7280;
        --thc-font-heading:  'Playfair Display', Georgia, serif;
        --thc-font-body:     'Inter', 'DM Sans', sans-serif;
      }
      body {
        background-color: var(--thc-bg);
        font-family: var(--thc-font-body);
        color: var(--thc-text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      h1, h2, h3, h4, h5, h6 { font-family: var(--thc-font-heading); }
      .thc-login-card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        padding: 2rem;
      }
      .thc-login-brand {
        font-family: var(--thc-font-heading);
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--thc-primary);
        text-align: center;
        margin-bottom: 1.5rem;
        letter-spacing: 0.01em;
      }
      .btn { font-family: var(--thc-font-body) !important; font-size: 0.875rem !important; font-weight: 600 !important; border-radius: 6px !important; padding: 0.5rem 1.25rem !important; box-shadow: none !important; }
      .btn-primary { background: #1a6473 !important; border-color: #1a6473 !important; color: #fff !important; }
      .btn-primary:hover { background: #135260 !important; border-color: #135260 !important; }
      .form-control { font-family: var(--thc-font-body); font-size: 0.875rem; border-color: #d1d5db; border-radius: 6px; }
      .form-control:focus { border-color: var(--thc-primary); box-shadow: 0 0 0 3px rgba(26,100,115,0.12); outline: none; }
      .form-label { font-size: 0.8rem; font-weight: 500; color: var(--thc-text-muted); margin-bottom: 0.3rem; }
      .invalid-feedback, .field-error { display: block; font-size: 0.75rem; color: #c0392b; margin-top: 0.2rem; }
      .alert-success { background-color: #4CAF50; color: white; padding: 15px; margin-bottom: 10px; }
      .alert-error { background-color: #f44336; color: white; padding: 15px; margin-bottom: 10px; }
    </style>
    {% block styles %}{% endblock %}
  </head>
  <body>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div class="alert alert-{{ category }} text-center">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
    <script src="{{ url_for('static', filename='vendor/js/bootstrap.bundle.min.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
