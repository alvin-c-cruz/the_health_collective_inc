<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/css/bootstrap-icons.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/css/fonts.css') }}">

    <title>{% block title %}The Health Collective{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
    <style>
      :root {
        --thc-primary:       #1a6473;
        --thc-primary-dark:  #135260;
        --thc-primary-light: #e6f3f5;
        --thc-bg:            #f8f9fa;
        --thc-surface:       #ffffff;
        --thc-border:        #e2e8f0;
        --thc-text:          #1a2a2a;
        --thc-text-muted:    #6b7280;
        --thc-font-heading:  'Playfair Display', Georgia, serif;
        --thc-font-body:     'Inter', 'DM Sans', sans-serif;
      }

      body {
        background: linear-gradient(135deg, #e6f3f5 0%, #f8f9fa 50%, #ffffff 100%);
        font-family: var(--thc-font-body);
        color: var(--thc-text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }

      /* Decorative background circles */
      body::before,
      body::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        opacity: 0.08;
        pointer-events: none;
      }

      body::before {
        width: 600px;
        height: 600px;
        background: var(--thc-primary);
        top: -300px;
        right: -200px;
      }

      body::after {
        width: 400px;
        height: 400px;
        background: var(--thc-primary);
        bottom: -200px;
        left: -150px;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: var(--thc-font-heading);
      }

      .thc-login-card {
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(226, 232, 240, 0.8);
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(26, 100, 115, 0.12),
                    0 8px 24px rgba(0, 0, 0, 0.08);
        padding: 3rem 2.5rem;
        position: relative;
        z-index: 1;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .thc-login-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 24px 72px rgba(26, 100, 115, 0.15),
                    0 12px 32px rgba(0, 0, 0, 0.1);
      }

      .thc-login-brand {
        font-family: var(--thc-font-heading);
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--thc-primary);
        text-align: center;
        margin-bottom: 0.5rem;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      .thc-login-subtitle {
        font-size: 0.9rem;
        color: var(--thc-text-muted);
        text-align: center;
        margin-bottom: 2rem;
        font-weight: 400;
      }

      .thc-login-title {
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--thc-text);
        text-align: center;
        margin-bottom: 2rem;
        font-family: var(--thc-font-body);
      }

      .btn {
        font-family: var(--thc-font-body) !important;
        font-size: 0.9375rem !important;
        font-weight: 600 !important;
        border-radius: 8px !important;
        padding: 0.75rem 1.5rem !important;
        box-shadow: none !important;
        transition: all 0.2s ease !important;
      }

      .btn-primary {
        background: var(--thc-primary) !important;
        border-color: var(--thc-primary) !important;
        color: #fff !important;
      }

      .btn-primary:hover {
        background: var(--thc-primary-dark) !important;
        border-color: var(--thc-primary-dark) !important;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(26, 100, 115, 0.3) !important;
      }

      .btn-primary:active {
        transform: translateY(0);
      }

      .form-control {
        font-family: var(--thc-font-body);
        font-size: 0.9375rem;
        border: 1.5px solid #d1d5db;
        border-radius: 8px;
        padding: 0.75rem 1rem;
        transition: all 0.2s ease;
      }

      .form-control:focus {
        border-color: var(--thc-primary);
        box-shadow: 0 0 0 4px rgba(26, 100, 115, 0.1);
        outline: none;
      }

      .form-label {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--thc-text);
        margin-bottom: 0.5rem;
        letter-spacing: 0.01em;
      }

      .invalid-feedback, .field-error {
        display: block;
        font-size: 0.8125rem;
        color: #dc3545;
        margin-top: 0.375rem;
        font-weight: 500;
      }

      .alert-success {
        background-color: #10b981;
        color: white;
        padding: 1rem 1.25rem;
        margin-bottom: 1.5rem;
        border-radius: 8px;
        font-weight: 500;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
      }

      .alert-error {
        background-color: #ef4444;
        color: white;
        padding: 1rem 1.25rem;
        margin-bottom: 1.5rem;
        border-radius: 8px;
        font-weight: 500;
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
      }

      .thc-login-footer {
        text-align: center;
        margin-top: 1.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--thc-border);
      }

      .thc-login-footer a {
        color: var(--thc-primary);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s ease;
      }

      .thc-login-footer a:hover {
        color: var(--thc-primary-dark);
        text-decoration: underline;
      }

      /* Input icons */
      .input-group-icon {
        position: relative;
      }

      .input-group-icon i {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--thc-text-muted);
        font-size: 1.125rem;
        pointer-events: none;
      }

      .input-group-icon .form-control {
        padding-left: 2.75rem;
      }
    </style>
    {% block styles %}{% endblock %}
  </head>
  <body>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div class="alert alert-{{ category }} text-center">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
    <script src="{{ url_for('static', filename='vendor/js/bootstrap.bundle.min.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
