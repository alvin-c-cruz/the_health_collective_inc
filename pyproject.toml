[project]
name = "the-health-collective-inc"
version = "1.0.0"
description = "Healthcare operations management system"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Proprietary"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# =============================================================================
# RUFF CONFIGURATION
# Ultra-fast Python linter and formatter (replaces flake8, black, isort, etc.)
# =============================================================================

[tool.ruff]
# Set the target Python version
target-version = "py38"

# Same as Black's default line length
line-length = 88

# Enable auto-fixing where possible
fix = true

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
    "htmlcov",
    "dist",
    "build",
    "*.egg-info",
    "migrations",  # Alembic migrations (auto-generated)
]

# Directories to check
src = ["application", "tests"]

[tool.ruff.lint]
# Enable specific rule sets
# See: https://docs.astral.sh/ruff/rules/
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade (modernize Python code)
    "B",      # flake8-bugbear (find likely bugs)
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RET",    # flake8-return (return statement issues)
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function call in argument defaults (Flask routes)
    "B904",   # Use `raise from` to specify exception cause (too strict)
    "PLR0913", # Too many arguments to function call (common in Flask)
    "PLR2004", # Magic value used in comparison (too strict)
    "RET504", # Unnecessary variable assignment before return (readability)
    "ARG001", # Unused function argument (Flask/decorator patterns)
    "ARG002", # Unused method argument (Flask/decorator patterns)
    "PTH123", # `open()` should be replaced by `Path.open()` (not critical)
    "SIM108", # Use ternary operator (readability preference)
]

# Allow fix for all enabled rules (when safe)
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Ignore import errors in __init__.py files
"__init__.py" = ["F401", "F403"]
# Test files can have more relaxed rules
"tests/**/*.py" = [
    "PLR2004",  # Magic values OK in tests
    "S101",     # assert statements OK in tests
    "ARG",      # Unused arguments OK in pytest fixtures
]

[tool.ruff.lint.isort]
# Import sorting configuration (similar to isort)
known-first-party = ["application", "tests"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.mccabe]
# Maximum allowed complexity
max-complexity = 10

[tool.ruff.lint.pydocstyle]
# Docstring convention
convention = "google"

[tool.ruff.format]
# Formatting configuration (replaces Black)
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# =============================================================================
# MYPY CONFIGURATION
# Static type checker for Python
# =============================================================================

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, make stricter over time
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Exclude patterns
exclude = [
    'migrations/',
    'venv/',
    '.venv/',
]

# Per-module options
[[tool.mypy.overrides]]
module = [
    "flask_sqlalchemy.*",
    "flask_migrate.*",
    "flask_login.*",
    "flask_bcrypt.*",
    "flask_mail.*",
    "factory.*",
    "faker.*",
]
ignore_missing_imports = true

# =============================================================================
# PYTEST CONFIGURATION
# Testing framework configuration
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Command line options
addopts = [
    "-v",                      # Verbose output
    "--strict-markers",        # Error on unknown markers
    "--tb=short",              # Shorter traceback format
    "--cov=application",       # Coverage for application directory
    "--cov-report=term-missing",  # Show missing lines in terminal
    "--cov-report=html",       # Generate HTML coverage report
    "--cov-fail-under=0",      # Don't fail on low coverage (yet)
]

# Markers for test categorization
markers = [
    "unit: Fast unit tests",
    "integration: Integration tests with database",
    "functional: Full workflow tests",
    "slow: Slow tests (skip during development)",
    "wip: Work in progress tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["application"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# =============================================================================
# NOTES
# =============================================================================

# To use these tools:
#
# 1. Install dependencies:
#    pip install ruff mypy pytest pytest-cov
#
# 2. Run ruff (linter + formatter):
#    ruff check .                  # Check for issues
#    ruff check --fix .            # Fix issues automatically
#    ruff format .                 # Format code
#
# 3. Run mypy (type checker):
#    mypy application/
#
# 4. Run pytest (tests):
#    pytest                        # Run all tests
#    pytest -m unit                # Run only unit tests
#    pytest --cov                  # Run with coverage
#
# 5. Run all checks before commit:
#    ruff check --fix . && ruff format . && mypy application/ && pytest
